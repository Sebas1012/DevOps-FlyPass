apiVersion: batch/v1
kind: CronJob
metadata:
  name: ip-reporter
  namespace: flypass
  labels:
    app.kubernetes.io/name: ip-reporter
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ip-reporter
        spec:
          serviceAccountName: s3-uploader
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: get-ip
              image: "${ECR_REPOSITORY_URL}:get-ip-${IMAGE_TAG}"
              env:
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
              volumeMounts:
                - name: shared-data
                  mountPath: /data
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
            - name: upload-s3
              image: "${ECR_REPOSITORY_URL}:upload-s3-${IMAGE_TAG}"
              env:
                - name: S3_BUCKET
                  value: "${S3_BUCKET}"
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: shared-data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: shared-data
              emptyDir: {}
            - name: tmp
              emptyDir: {}
